<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1350px; font-family: 'Inter', sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1350px; position: relative; display: flex; flex-direction: column; background: #0F0F13; color: #FFFFFF; justify-content: center; align-items: center; text-align: center; padding: 90px; }
.brand { position: absolute; bottom: 45px; left: 60px; font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #FFFFFF; opacity: 0.45; }
.slide_num { position: absolute; bottom: 45px; right: 60px; font-size: 16px; font-weight: 600; color: #FFFFFF; opacity: 0.45; }
</style>
</head>
<body>
<div class="slide">

  
  <div style='color: #FFFFFF; font-size: 46px; font-weight: 800; line-height: 1.2; margin-bottom: 25px; max-width: 900px;'>The 3 Pillars of Architecture</div>
  
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="160" viewBox="0 0 980 160" style="margin: 20px 0;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A1A1AA"/>
    </marker>
  </defs>
  
    <g transform="translate(30, 40)">
      <rect width="190" height="80" rx="10" fill="rgba(255,255,255,0.05)" stroke="#00E5CC" stroke-width="3"/>
      <text x="95.0" y="46.0" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Concept</text>
    </g>
    <path d="M 220 80.0 L 260 80.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(270, 40)">
      <rect width="190" height="80" rx="10" fill="rgba(255,255,255,0.05)" stroke="#FF4B4B" stroke-width="3"/>
      <text x="95.0" y="46.0" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Flow</text>
    </g>
    <path d="M 460 80.0 L 500 80.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(510, 40)">
      <rect width="190" height="80" rx="10" fill="rgba(255,255,255,0.05)" stroke="#00E5CC" stroke-width="3"/>
      <text x="95.0" y="46.0" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Output</text>
    </g>
    <path d="M 700 80.0 L 740 80.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(750, 40)">
      <rect width="190" height="80" rx="10" fill="rgba(255,255,255,0.05)" stroke="#FF4B4B" stroke-width="3"/>
      <text x="95.0" y="46.0" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Production</text>
    </g>
</svg>
  <div style='width: 100%; display: flex; flex-direction: column; align-items: center;'></div>

  <div class="brand">AIWITHSUFIYAN</div>
  <div class="slide_num">3/6</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1350px; font-family: 'Inter', sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1350px; position: relative; display: flex; flex-direction: column; background: #0F0F13; color: #FFFFFF; justify-content: center; align-items: center; text-align: center; padding: 90px; }
.brand { position: absolute; bottom: 45px; left: 60px; font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #FFFFFF; opacity: 0.45; }
.slide_num { position: absolute; bottom: 45px; right: 60px; font-size: 16px; font-weight: 600; color: #FFFFFF; opacity: 0.45; }
</style>
</head>
<body>
<div class="slide">

  <div style='color: #00E5CC; font-size: 52px; font-weight: 800; line-height: 1.2; margin-bottom: 40px; max-width: 900px;'>Core Concept</div>
  <div style='color: #FFFFFF; font-size: 32px; font-weight: 400; line-height: 1.6; max-width: 880px; text-align: left; background: rgba(255,255,255,0.03); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);'></div>

  <div class="brand">AIWITHSUFIYAN</div>
  <div class="slide_num">2/6</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1350px; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; background: #090A0F; }
.slide { width: 1080px; height: 1350px; position: relative; display: flex; flex-direction: column; background: #090A0F; color: #FFFFFF; justify-content: center; align-items: center; text-align: center; padding: 90px; overflow: hidden; }
.glow-blob-1 { position: absolute; top: -120px; left: -120px; width: 480px; height: 480px; background: rgba(0, 229, 204, 0.18); filter: blur(95px); border-radius: 50%; pointer-events: none; z-index: 1; }
.glow-blob-2 { position: absolute; bottom: -140px; right: -140px; width: 520px; height: 520px; background: rgba(255, 75, 75, 0.16); filter: blur(105px); border-radius: 50%; pointer-events: none; z-index: 1; }
.content { position: relative; z-index: 2; width: 100%; display: flex; flex-direction: column; align-items: center; }
.mac-card { background: rgba(18, 20, 30, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.18); border-radius: 18px; position: relative; overflow: hidden; backdrop-filter: blur(24px); }
.mac-dots { display: flex; gap: 8px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot-red { background: #FF5F56; }
.dot-yellow { background: #FFBD2E; }
.dot-green { background: #27C93F; }
.card-strip { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
.footer { position: absolute; bottom: 40px; left: 60px; right: 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.12); padding-top: 22px; z-index: 2; }
.brand { font-size: 16px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #FFFFFF; opacity: 0.65; }
.slide_num { font-size: 16px; font-weight: 800; color: #00E5CC; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); padding: 6px 18px; border-radius: 8px; }
</style>
</head>
<body>
<div class="slide">
  <div class="glow-blob-1"></div>
  <div class="glow-blob-2"></div>
  <div class="content">

  
  <div style='color: #FFFFFF; font-size: 64px; font-weight: 900; line-height: 1.18; margin-bottom: 40px; max-width: 940px; text-shadow: 0 0 40px rgba(255,255,255,0.1);'>Modern Tech Architecture is Broken.</div>
  <div style='color: #B0B0B0; font-size: 32px; font-weight: 500; line-height: 1.5; max-width: 880px;'>Why 80% of engineers struggle with production implementation—and the exact blueprint to fix it.</div>

  </div>
  <div class="footer">
    <div class="brand">✦ AIWITHSUFIYAN — ARCHITECTURE BLUEPRINT</div>
    <div class="slide_num">01 / 06</div>
  </div>
</div>
</body>
</html>
